<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 냉장고 파먹기 셰프</title>
    
    <!-- 카카오톡 등 메신저 공유용 Open Graph 메타 태그 -->
    <meta property="og:title" content="AI 냉장고 파먹기 셰프 👩‍🍳">
    <meta property="og:description" content="냉장고에 남은 재료를 입력하면 AI가 맞춤형 레시피를 추천해 드립니다!">
    <meta property="og:image" content="https://placehold.co/800x400/ff9800/ffffff?text=AI+Fridge+Chef">
    <meta property="og:type" content="website">

    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f9fafb; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tag-enter { animation: scaleIn 0.2s ease-out forwards; }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        /* 로딩 스피너 애니메이션 */
        .spinner {
            border: 4px solid rgba(255, 152, 0, 0.2);
            border-left-color: #ff9800;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 antialiased pb-24">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
    
    <!-- 헤더 -->
    <header class="bg-orange-500 text-white p-5 sticky top-0 z-10 shadow-md">
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <span>🍳</span> AI 냉장고 파먹기
        </h1>
        <p class="text-orange-100 text-sm mt-1">남은 재료로 만드는 최고의 레시피</p>
    </header>

    <main class="p-5 space-y-8">
        
        <!-- 현재 선택된 재료 표시 영역 -->
        <section>
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
                🛒 내 냉장고 속 재료
            </h2>
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 min-h-[80px]">
                <div id="selectedIngredientsContainer" class="flex flex-wrap gap-2">
                    <span class="text-gray-400 text-sm" id="emptyIngredientsMsg">아래에서 재료를 추가하거나 직접 입력해보세요.</span>
                </div>
            </div>
            
            <!-- 재료 직접 입력창 -->
            <div class="mt-3 flex gap-2">
                <input type="text" id="manualIngredientInput" class="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors" placeholder="예: 양배추, 스팸 (쉼표로 구분)">
                <button id="manualAddBtn" type="button" class="bg-gray-800 text-white px-5 py-3 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors shrink-0">담기</button>
            </div>
        </section>

        <!-- 자주 쓰는 식재료 -->
        <section>
            <div class="flex justify-between items-end mb-3">
                <h2 class="text-md font-semibold text-gray-700">추천 식재료</h2>
            </div>
            <div id="quickIngredientsContainer" class="flex flex-wrap gap-2 mb-3">
                <!-- JS로 렌더링 됨 -->
            </div>
            
            <!-- 나만의 식재료 커스텀 추가 폼 -->
            <div class="flex gap-2 items-center bg-orange-50 p-2 rounded-lg">
                <input type="text" id="customIngredientInput" class="flex-1 bg-white border border-orange-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-orange-400" placeholder="자주 쓰는 재료 추가 (예: 베이컨)">
                <button id="customIngredientAddBtn" type="button" class="text-orange-600 font-medium px-3 py-2 text-sm rounded-md bg-orange-100 hover:bg-orange-200 transition-colors">추가</button>
            </div>
        </section>

        <!-- 보유 양념 선택 -->
        <section>
            <h2 class="text-md font-semibold text-gray-700 mb-3">보유 중인 기본 양념</h2>
            <div id="condimentsContainer" class="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-3">
                <!-- JS로 렌더링 됨 -->
            </div>
            
            <!-- 나만의 양념 커스텀 추가 폼 -->
            <div class="flex gap-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-100">
                <input type="text" id="customCondimentInput" class="flex-1 bg-white border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-gray-400" placeholder="기타 양념 추가 (예: 굴소스)">
                <button id="customCondimentAddBtn" type="button" class="text-gray-600 font-medium px-3 py-2 text-sm rounded-md bg-gray-200 hover:bg-gray-300 transition-colors">추가</button>
            </div>
        </section>

        <!-- 요리 테마 선택 -->
        <section>
            <h2 class="text-md font-semibold text-gray-700 mb-3">어떤 요리를 원하시나요?</h2>
            <div class="flex flex-wrap gap-2" id="themeContainer">
                <label class="cursor-pointer">
                    <input type="radio" name="theme" value="상관없음" class="peer sr-only" checked>
                    <div class="px-4 py-2 rounded-full border border-gray-300 text-sm text-gray-600 peer-checked:bg-orange-500 peer-checked:text-white peer-checked:border-orange-500 transition-colors">아무거나</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="theme" value="10분 초간단" class="peer sr-only">
                    <div class="px-4 py-2 rounded-full border border-gray-300 text-sm text-gray-600 peer-checked:bg-orange-500 peer-checked:text-white peer-checked:border-orange-500 transition-colors">⏱️ 10분 초간단</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="theme" value="든든한 집밥" class="peer sr-only">
                    <div class="px-4 py-2 rounded-full border border-gray-300 text-sm text-gray-600 peer-checked:bg-orange-500 peer-checked:text-white peer-checked:border-orange-500 transition-colors">🍚 든든한 집밥</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="theme" value="술안주" class="peer sr-only">
                    <div class="px-4 py-2 rounded-full border border-gray-300 text-sm text-gray-600 peer-checked:bg-orange-500 peer-checked:text-white peer-checked:border-orange-500 transition-colors">🍺 술안주</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="theme" value="다이어트/건강식" class="peer sr-only">
                    <div class="px-4 py-2 rounded-full border border-gray-300 text-sm text-gray-600 peer-checked:bg-orange-500 peer-checked:text-white peer-checked:border-orange-500 transition-colors">🥗 다이어트</div>
                </label>
            </div>
        </section>

        <!-- 결과 렌더링 영역 -->
        <section id="resultSection" class="hidden pb-10">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">✨ AI 셰프의 추천 레시피</h2>
            <div id="recipeCardsContainer" class="space-y-4">
                <!-- 레시피 카드가 여기에 추가됨 -->
            </div>
        </section>
        
    </main>

    <!-- 하단 고정 추천 버튼 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 max-w-md mx-auto z-20">
        <button id="submitBtn" type="button" class="w-full bg-orange-500 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:bg-orange-600 active:transform active:scale-95 transition-all flex justify-center items-center gap-2">
            <span>✨ 레시피 추천받기</span>
        </button>
    </div>
</div>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 hidden flex-col justify-center items-center">
    <div class="spinner mb-4"></div>
    <h3 class="text-lg font-bold text-gray-800">AI 셰프가 고민 중입니다...</h3>
    <p class="text-gray-500 text-sm mt-2 text-center px-6">입력하신 재료와 양념의 황금 비율을<br>찾고 있어요! (약 5~10초 소요)</p>
</div>

<!-- 토스트 알림 (alert 대체용) -->
<div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    알림 메시지
</div>

<!-- 레시피 상세 모달 -->
<div id="recipeModal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-center items-end sm:items-center sm:p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="recipeModalContent">
        
        <!-- 모달 헤더 -->
        <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white rounded-t-2xl">
            <h3 class="text-xl font-bold text-gray-800" id="modalTitle">레시피 이름</h3>
            <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        
        <!-- 모달 컨텐츠 (스크롤) -->
        <div class="p-5 overflow-y-auto flex-1 bg-gray-50" id="modalBody">
            <!-- 메타 정보 -->
            <div class="flex gap-2 mb-6" id="modalMeta">
                <!-- JS 렌더링 -->
            </div>
            
            <!-- 재료 목록 -->
            <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-orange-100">
                <h4 class="font-bold text-orange-600 mb-3 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    필요한 재료
                </h4>
                <ul class="list-disc pl-5 text-gray-700 text-sm space-y-1" id="modalIngredients">
                    <!-- JS 렌더링 -->
                </ul>
            </div>
            
            <!-- 조리 순서 -->
            <div class="mb-6">
                <h4 class="font-bold text-gray-800 mb-4 text-lg">👨‍🍳 조리 순서</h4>
                <div class="space-y-4" id="modalSteps">
                    <!-- JS 렌더링 -->
                </div>
            </div>
            
            <!-- 팁 -->
            <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl" id="modalTipsContainer">
                <h4 class="font-bold text-blue-700 text-sm mb-1">💡 셰프의 꿀팁</h4>
                <p class="text-blue-800 text-sm leading-relaxed" id="modalTips"></p>
            </div>
        </div>
        
        <!-- 모달 푸터 (복사 버튼) -->
        <div class="p-4 border-t bg-white">
            <button onclick="copyRecipeText()" class="w-full bg-gray-800 text-white py-3 rounded-xl font-medium flex justify-center items-center gap-2 hover:bg-gray-700 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                레시피 텍스트로 복사하기
            </button>
        </div>
    </div>
</div>

<script>
    // 상태 관리 변수
    let myIngredients = new Set();
    let myCondiments = new Set();
    let recipeResultsData = []; // API 결과 저장용
    let currentViewingRecipe = null; // 현재 모달에서 보는 레시피

    // 기본 제공 데이터
    let quickIngredientsList = ['계란', '양파', '대파', '마늘', '스팸', '참치캔', '돼지고기', '두부', '김치', '감자', '소시지', '치즈'];
    let quickCondimentsList = ['간장', '소금', '설탕', '고춧가루', '참기름', '식용유', '고추장', '된장', '다진마늘', '후추', '굴소스', '케첩'];

    // DOM 요소 초기화
    document.addEventListener('DOMContentLoaded', () => {
        renderQuickIngredients();
        renderCondiments();
        
        // 직접 입력칸 엔터 키 이벤트 처리
        document.getElementById('manualIngredientInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addManualIngredients();
        });
        document.getElementById('customIngredientInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addCustomQuickIngredient();
        });
        document.getElementById('customCondimentInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addCustomCondiment();
        });

        document.getElementById('manualAddBtn').addEventListener('click', addManualIngredients);
        document.getElementById('customIngredientAddBtn').addEventListener('click', addCustomQuickIngredient);
        document.getElementById('customCondimentAddBtn').addEventListener('click', addCustomCondiment);
        document.getElementById('submitBtn').addEventListener('click', fetchRecipes);
    });

    // 커스텀 알림 함수 (alert 대체)
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, 2500);
    }

    // 보안: 사용자 입력과 AI 응답을 HTML로 해석하지 않도록 이스케이프합니다.
    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // 상단 '내 냉장고 속 재료' 렌더링
    function renderSelectedIngredients() {
        const container = document.getElementById('selectedIngredientsContainer');
        container.innerHTML = '';
        if (myIngredients.size === 0) {
            const emptyMsg = document.createElement('span');
            emptyMsg.id = 'emptyIngredientsMsg';
            emptyMsg.className = 'text-gray-400 text-sm';
            emptyMsg.textContent = '아래에서 재료를 추가하거나 직접 입력해보세요.';
            container.appendChild(emptyMsg);
            return;
        }
        myIngredients.forEach(item => {
            const span = document.createElement('span');
            span.className = 'tag-enter inline-flex items-center gap-1 bg-orange-100 text-orange-800 px-3 py-1.5 rounded-full text-sm font-medium border border-orange-200 shadow-sm';
            const text = document.createElement('span'); text.textContent = item;
            const removeBtn = document.createElement('button');
            removeBtn.className = 'text-orange-400 hover:text-orange-600 focus:outline-none ml-1';
            removeBtn.type = 'button'; removeBtn.setAttribute('aria-label', item + ' 삭제');
            removeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            removeBtn.addEventListener('click', () => removeIngredient(item));
            span.appendChild(text);
            span.appendChild(removeBtn);
            container.appendChild(span);
        });
    }

    // 재료 추가 로직
    function addIngredient(item) {
        const cleanItem = item.trim();
        if (cleanItem && !myIngredients.has(cleanItem)) {
            myIngredients.add(cleanItem);
            renderSelectedIngredients();
        }
    }

    function removeIngredient(item) {
        myIngredients.delete(item);
        renderSelectedIngredients();
    }

    // 수동 재료 텍스트 입력 처리 (쉼표 구분)
    function addManualIngredients() {
        const input = document.getElementById('manualIngredientInput');
        const val = input.value;
        if (!val.trim()) return;

        const items = val.split(',').map(i => i.trim()).filter(i => i);
        items.forEach(item => addIngredient(item));
        input.value = '';
    }

    // 추천 식재료 버튼 렌더링
    function renderQuickIngredients() {
        const container = document.getElementById('quickIngredientsContainer');
        container.innerHTML = '';
        quickIngredientsList.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'px-3 py-1.5 bg-white border border-gray-300 rounded-full text-sm text-gray-700 hover:border-orange-500 hover:text-orange-500 transition-colors shadow-sm';
            btn.innerText = '+ ' + item;
            btn.onclick = () => addIngredient(item);
            container.appendChild(btn);
        });
    }

    // 사용자 정의 추천 식재료 추가
    function addCustomQuickIngredient() {
        const input = document.getElementById('customIngredientInput');
        const val = input.value.trim();
        if(val && !quickIngredientsList.includes(val)) {
            quickIngredientsList.push(val);
            renderQuickIngredients();
            addIngredient(val); // 내 냉장고에도 즉시 추가
            input.value = '';
            showToast(`'${val}'이(가) 자주 쓰는 재료에 등록되었습니다.`);
        }
    }

    // 기본 양념 체크박스 렌더링
    function renderCondiments() {
        const container = document.getElementById('condimentsContainer');
        container.innerHTML = '';
        quickCondimentsList.forEach(item => {
            const label = document.createElement('label');
            label.className = 'flex items-center gap-2 cursor-pointer bg-white p-2 border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50';
            
            const isChecked = myCondiments.has(item) ? 'checked' : '';
            
            label.innerHTML = `
                <input type="checkbox" value="${item}" class="w-4 h-4 text-orange-500 rounded focus:ring-orange-500" onchange="toggleCondiment('${item}', this.checked)" ${isChecked}>
                <span class="text-sm text-gray-700">${item}</span>
            `;
            container.appendChild(label);
        });
    }

    // 양념 토글
    function toggleCondiment(item, isChecked) {
        if (isChecked) myCondiments.add(item);
        else myCondiments.delete(item);
    }

    // 사용자 정의 양념 추가
    function addCustomCondiment() {
        const input = document.getElementById('customCondimentInput');
        const val = input.value.trim();
        if(val && !quickCondimentsList.includes(val)) {
            quickCondimentsList.push(val);
            myCondiments.add(val); // 즉시 체크 처리
            renderCondiments();
            input.value = '';
            showToast(`'${val}'이(가) 보유 양념에 추가되었습니다.`);
        }
    }

    // Gemini API 호출 및 레시피 가져오기
    async function fetchRecipes() {
        if (myIngredients.size === 0) {
            showToast("냉장고에 있는 재료를 최소 1개 이상 추가해주세요!");
            return;
        }

        const btn = document.getElementById('submitBtn');
        const overlay = document.getElementById('loadingOverlay');
        const resultSection = document.getElementById('resultSection');
        
        // 상태 준비
        const ingredientsList = Array.from(myIngredients).join(', ');
        const condimentsList = Array.from(myCondiments).join(', ') || '없음';
        const theme = document.querySelector('input[name="theme"]:checked').value;

        overlay.style.display = 'flex';
        btn.disabled = true;
        resultSection.classList.add('hidden');

        try {
            // 구조화된 JSON 응답을 위한 프롬프트 작성
            const systemPrompt = `당신은 최고의 요리 연구가이자 AI 셰프입니다. 사용자가 제공한 재료와 양념, 그리고 원하는 요리 테마를 바탕으로 가장 맛있고 현실적인 요리 레시피 3가지를 추천해야 합니다.
반드시 JSON 배열 형태로만 응답해야 하며, 다른 텍스트는 출력하지 마세요.
유명 셰프(백종원, 류수영, 이연복 등)의 레시피 스타일과 유사하다면 'chefStyle' 필드에 셰프 이름을 넣어주세요. (없으면 빈 문자열)`;

            const userPrompt = `
- 냉장고 재료: ${ingredientsList}
- 보유 중인 양념: ${condimentsList}
- 요리 테마: ${theme}

위 조건으로 만들 수 있는 레시피 3개를 추천해줘.`;

            // Gemini API 호출 설정 (JSON Schema 강제)
            const payload = {
                contents: [{ parts: [{ text: systemPrompt + "\n\n" + userPrompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "recipeName": { "type": "STRING", "description": "요리 이름 (예: 백종원표 스팸 김치찌개)" },
                                "chefStyle": { "type": "STRING", "description": "유사한 스타일의 한국 유명 셰프 이름 (예: 백종원, 류수영 등). 해당 없으면 빈 문자열" },
                                "time": { "type": "STRING", "description": "예상 소요 시간 (예: 15분)" },
                                "difficulty": { "type": "STRING", "description": "난이도 (예: 하, 중, 상)" },
                                "ingredientsList": { 
                                    "type": "ARRAY", 
                                    "items": { "type": "STRING" },
                                    "description": "정확한 재료와 양 (예: 김치 1종이컵, 스팸 1캔)" 
                                },
                                "steps": { 
                                    "type": "ARRAY", 
                                    "items": { "type": "STRING" },
                                    "description": "조리 순서 목록" 
                                },
                                "tips": { "type": "STRING", "description": "요리를 더 맛있게 하는 셰프의 꿀팁 1문장" }
                            },
                            "propertyOrdering": ["recipeName", "chefStyle", "time", "difficulty", "ingredientsList", "steps", "tips"]
                        }
                    }
                }
            };

            // API 키는 Vercel 서버리스 함수의 환경변수에서만 사용합니다.
            const apiUrl = '/api/recipes';

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("API Network Error");

            const result = await response.json();
            
            if (result.candidates && result.candidates.length > 0) {
                const jsonStr = result.candidates[0].content.parts[0].text;
                recipeResultsData = JSON.parse(jsonStr);
                renderRecipeCards();
                
                resultSection.classList.remove('hidden');
                // 부드럽게 결과 영역으로 스크롤
                setTimeout(() => {
                    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            } else {
                throw new Error("결과 파싱 실패");
            }

        } catch (error) {
            console.error(error);
            showToast("레시피를 불러오는데 실패했습니다. 다시 시도해주세요.");
        } finally {
            overlay.style.display = 'none';
            btn.disabled = false;
        }
    }

    // 추천 결과 카드 화면에 그리기
    function renderRecipeCards() {
        const container = document.getElementById('recipeCardsContainer'); container.innerHTML = '';
        recipeResultsData.forEach((recipe, index) => {
            const chefBadge = recipe.chefStyle && recipe.chefStyle.trim() !== '' ? '<span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded border border-red-200 ml-2">👨‍🍳 ' + escapeHtml(recipe.chefStyle) + ' 스타일</span>' : '';
            const card = document.createElement('div');
            card.className = 'bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden cursor-pointer hover:shadow-lg hover:border-orange-200 transition-all active:scale-[0.98]';
            card.addEventListener('click', () => openModal(index));
            card.innerHTML = '<div class="p-5 flex flex-col justify-between h-full"><div><div class="flex items-start justify-between mb-2"><h3 class="text-lg font-bold text-gray-800 break-keep leading-tight">' + escapeHtml(recipe.recipeName) + ' ' + chefBadge + '</h3><div class="w-8 h-8 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center shrink-0">›</div></div><div class="flex gap-2 mb-3"><span class="inline-flex items-center gap-1 bg-gray-100 text-gray-600 text-xs px-2.5 py-1 rounded-md">⏱️ ' + escapeHtml(recipe.time) + '</span><span class="inline-flex items-center gap-1 bg-gray-100 text-gray-600 text-xs px-2.5 py-1 rounded-md">⭐ 난이도: ' + escapeHtml(recipe.difficulty) + '</span></div><p class="text-sm text-gray-600 line-clamp-2 bg-gray-50 p-2 rounded">' + escapeHtml(recipe.tips) + '</p></div></div>';
            container.appendChild(card);
        });
    }

    // 모달 열기
    function openModal(index) {
        const recipe = recipeResultsData[index]; currentViewingRecipe = recipe;
        document.getElementById('modalTitle').textContent = recipe.recipeName || '레시피';
        const chefHtml = recipe.chefStyle ? '<span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded border border-red-200">👨‍🍳 ' + escapeHtml(recipe.chefStyle) + ' 스타일</span>' : '';
        document.getElementById('modalMeta').innerHTML = chefHtml + '<span class="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-1 rounded">⏱️ ' + escapeHtml(recipe.time) + '</span><span class="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-1 rounded">⭐ 난이도: ' + escapeHtml(recipe.difficulty) + '</span>';
        document.getElementById('modalIngredients').innerHTML = (Array.isArray(recipe.ingredientsList) ? recipe.ingredientsList : []).map(item => '<li>' + escapeHtml(item) + '</li>').join('');
        document.getElementById('modalSteps').innerHTML = (Array.isArray(recipe.steps) ? recipe.steps : []).map((step, idx) => '<div class="flex gap-3"><div class="w-6 h-6 rounded-full bg-orange-500 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">' + (idx + 1) + '</div><p class="text-sm text-gray-700 leading-relaxed pt-0.5">' + escapeHtml(step) + '</p></div>').join('');
        document.getElementById('modalTips').textContent = recipe.tips || '';
        const modal = document.getElementById('recipeModal'); const content = document.getElementById('recipeModalContent');
        modal.classList.remove('hidden'); void modal.offsetWidth; modal.classList.remove('opacity-0'); modal.classList.add('opacity-100'); content.classList.remove('translate-y-full');
    }

    // 모달 닫기
    function closeModal() {
        const modal = document.getElementById('recipeModal');
        const content = document.getElementById('recipeModalContent');
        
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0');
        content.classList.add('translate-y-full');
        
        setTimeout(() => {
            modal.classList.add('hidden');
            currentViewingRecipe = null;
        }, 300);
    }

    // 레시피 텍스트 복사 (카카오톡 공유용)
    function copyRecipeText() {
        if(!currentViewingRecipe) return;
        const r = currentViewingRecipe;
        
        let text = `🍳 [${r.recipeName}]\n`;
        if(r.chefStyle) text += `👨‍🍳 ${r.chefStyle} 스타일\n`;
        text += `⏱️ 소요시간: ${r.time} | ⭐ 난이도: ${r.difficulty}\n\n`;
        
        text += `[재료]\n`;
        r.ingredientsList.forEach(i => text += `- ${i}\n`);
        
        text += `\n[조리 순서]\n`;
        r.steps.forEach((s, idx) => text += `${idx+1}. ${s}\n`);
        
        text += `\n💡 꿀팁: ${r.tips}\n`;
        text += `\n🤖 AI 냉장고 파먹기 셰프가 추천했어요!`;

        // Clipboard API 사용 (iframe/모바일 호환)
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast("레시피가 복사되었습니다! 카카오톡에 붙여넣기 하세요.");
        } catch (err) {
            showToast("복사에 실패했습니다.");
        }
        document.body.removeChild(textArea);
    }
</script>
</body>
</html>
